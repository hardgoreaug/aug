  let b=e.beta,g=e.gamma;
  const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  if(ang==90){[b,g]=[-g,b]} else if(ang==-90||ang==270){[b,g]=[g,-b]}
  if(!base) base={b,g};
  base.b+=(b-base.b)*.004; base.g+=(g-base.g)*.004;     // recentra devagar
  ty=clamp((g-base.g)/17,1.12); tx=clamp((b-base.b)/20,1.15);
}
function onPointer(e){
  if(sensor) return;
  ty=clamp((e.clientX/innerWidth-.5)*2.6,1.12); tx=clamp((e.clientY/innerHeight-.5)*2.6,1.15);
  last=performance.now();
}
addEventListener('pointermove',onPointer); addEventListener('pointerdown',onPointer);
function listen(){ addEventListener('deviceorientation',onOrient,true); }
const needsPerm=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
if(!window.isSecureContext){ hint.textContent='abra pelo link https para usar o giroscópio'; }
else if(needsPerm){
  btn.hidden=false; hint.style.opacity=0;
  btn.addEventListener('click',async()=>{
    try{ const r=await DeviceOrientationEvent.requestPermission();
      if(r==='granted'){listen(); btn.hidden=true;}
      else {btn.textContent='Permissão negada: arraste o dedo'; setTimeout(()=>btn.hidden=true,2500);} }
    catch(err){btn.textContent='Arraste o dedo na tela'; setTimeout(()=>btn.hidden=true,2500);}
  });
} else listen();

let nextBlink=2, t0=performance.now();
function frame(now){
  const t=(now-t0)/1000;
  let ix=tx,iy=ty;
  if(performance.now()-last>2500){ ix=Math.sin(t*.7)*.1; iy=Math.sin(t*.5)*.35; if(!sensor){tx*=.98;ty*=.98;} }
  ax+=(ix-ax)*.12; ay+=(iy-ay)*.12;
  let op=1;
  if(t>nextBlink){ const p=(t-nextBlink)/0.18; if(p>=1) nextBlink=t+2.5+Math.random()*3.5; else op=Math.max(0.06,Math.abs(1-2*p)); }
  path.setAttribute('d',shape(ay,ax,op));
  // um pouco de deslocamento e giro acompanhando o movimento
  path.setAttribute('transform','translate('+(ay*28).toFixed(1)+','+(Math.sin(t*1.3)*6+ax*18).toFixed(1)+') rotate('+(ay*3).toFixed(2)+' 0 500)');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
